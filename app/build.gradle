plugins {
    id 'com.android.application'
}

import java.math.RoundingMode
import java.util.TimeZone
import org.apache.tools.ant.taskdefs.condition.Os
import java.util.Properties

def versionPropsFile = rootProject.file('gradle.properties')
def versionProps = new Properties()
if (versionPropsFile.exists()) {
    versionPropsFile.withInputStream { versionProps.load(it) }
}

def appVersionCode = (versionProps.getProperty('APP_VERSION_CODE', '1') as String).toInteger()
def appVersionName = versionProps.getProperty('APP_VERSION_NAME', '1.0') as String

def requestedTasks = gradle.startParameter.taskNames.collect { it.toLowerCase() }
def isDebugVersionBuildRequested = requestedTasks.any { it.contains('debug') } && !requestedTasks.any { it.contains('release') }

/**
 * 隐藏壁纸（assets/<id>/info.json 里 "hidden": true）不编入正式发布包。
 *
 * 列表从 info.json 自动推导，不写死名字 —— 以后再把某个壁纸标记为隐藏，
 * 不需要改构建脚本，它就会自动从正式包里消失。
 *
 * debug 构建仍然保留，方便继续开发这些壁纸。
 */
def hiddenAssetDirs = []
file('src/main/assets').listFiles()?.each { dir ->
    if (!dir.isDirectory()) return
    def info = new File(dir, 'info.json')
    if (!info.exists()) return
    try {
        if (new groovy.json.JsonSlurper().parseText(info.text).hidden == true) {
            hiddenAssetDirs << dir.name
        }
    } catch (Exception ignored) {
        // 解析失败就当它不是隐藏壁纸，不因为一个坏 json 影响构建
    }
}

// 同时请求 debug 与 release 时（例如 `./gradlew assemble`）只能二选一，
// 这里按正式包处理并明确告知，避免 debug 少素材时一头雾水。
if (requestedTasks.any { it.contains('release') } && requestedTasks.any { it.contains('debug') }) {
    println("[assets] 本次构建同时包含 debug 与 release，按正式包处理，" +
            "隐藏壁纸不编入：" + hiddenAssetDirs +
            "  仅需 debug 时请单独执行 assembleDebug")
}
def debugTimestamp = new Date().format('yyyy.MM.dd.HH.mm', TimeZone.getTimeZone('Asia/Shanghai'))
def resolvedAppVersionName = isDebugVersionBuildRequested
    ? "DeBug${debugTimestamp}"
    : appVersionName

def bumpAppVersion = {
    Properties props = new Properties()
    if (versionPropsFile.exists()) {
        versionPropsFile.withInputStream { props.load(it) }
    }

    int currentCode = (props.getProperty('APP_VERSION_CODE', '1') as String).toInteger()
    String currentName = props.getProperty('APP_VERSION_NAME', '1.0') as String

    BigDecimal nextName = new BigDecimal(currentName)
            .add(new BigDecimal('0.1'))
            .setScale(1, RoundingMode.HALF_UP)

    props.setProperty('APP_VERSION_CODE', String.valueOf(currentCode + 1))
    props.setProperty('APP_VERSION_NAME', nextName.toPlainString())

    versionPropsFile.withOutputStream { output ->
        props.store(output, 'App version managed by Gradle')
    }

    println("[version] Release built. Next versionName=${nextName.toPlainString()}, versionCode=${currentCode + 1}")
}

android {
    /*
     * ASTC 贴图本来就是压缩态，再让 aapt deflate 一遍只是白花安装期和读取期的 CPU。
     */
    aaptOptions {
        noCompress 'astc'
    }

	compileSdk 35
	namespace "com.reandroid.wallpaper"

    ndkVersion "25.2.9519653"

    buildFeatures {
        buildConfig true
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
            shaders.srcDirs = ['src/main/shaders']
        }
    }

    androidResources {
        /*
         * 为什么用全局设置而不是按变体：AGP 8.7 的 Variant.androidResources
         * 没有暴露 ignoreAssetsPattern（实测报 MissingPropertyException），只能全局设。
         *
         * 判定取"纯 debug 构建才保留"，其余一律过滤 —— 失败方向要安全：
         * 万一判断错，宁可 debug 包少两个开发用壁纸，也不能让隐藏素材漏进正式包。
         *
         * <default> 是 AAPT 的占位符（内置默认忽略规则），后面直接写目录名即为"忽略"。
         */
        ignoreAssetsPattern = (isDebugVersionBuildRequested || hiddenAssetDirs.isEmpty())
                ? '<default>'
                : ('<default>:' + hiddenAssetDirs.join(':'))
    }

    defaultConfig {
        applicationId "com.reandroid.wallpaper"
        minSdk 24
        targetSdk 35
        versionCode appVersionCode
        versionName resolvedAppVersionName

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        // arrays in locale-specific folders (zh-rCN, ja, ko, etc.) override base values
        // without a corresponding base declaration — these are intentional translations,
        // not leftover cruft.
        disable 'ExtraTranslation'
    }

    signingConfigs {
        release {
            // 使用 gradle.properties 中定义的变量（安全访问，避免未定义属性抛出异常）
            def releaseStoreFile = project.hasProperty('RELEASE_STORE_FILE') ? project.property('RELEASE_STORE_FILE') : "${rootDir}/NNBW666.jks"
            storeFile file(releaseStoreFile)

            storePassword project.hasProperty('RELEASE_STORE_PASSWORD') ? project.property('RELEASE_STORE_PASSWORD') : ''
            keyAlias project.hasProperty('RELEASE_KEY_ALIAS') ? project.property('RELEASE_KEY_ALIAS') : ''
            keyPassword project.hasProperty('RELEASE_KEY_PASSWORD') ? project.property('RELEASE_KEY_PASSWORD') : ''
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
        }
        debug {
            // 使用与 release 相同的 signingConfig（可改为单独的 debug keystore）
            signingConfig signingConfigs.release
        }
    }
}

def ndkBuildExecutable = new File(android.ndkDirectory, Os.isFamily(Os.FAMILY_WINDOWS) ? 'ndk-build.cmd' : 'ndk-build')

tasks.register('buildVulkanNative', Exec) {
    workingDir file('src/main/jni')
    commandLine ndkBuildExecutable.absolutePath,
            'NDK_PROJECT_PATH=null',
            'APP_BUILD_SCRIPT=Android.mk',
            'NDK_APPLICATION_MK=Application.mk',
            'NDK_OUT=../../../build/galaxyvk/obj',
            'NDK_LIBS_OUT=../jniLibs',
            'APP_ABI=arm64-v8a,armeabi-v7a,x86,x86_64',
            'APP_PLATFORM=android-24'
}

tasks.named('preBuild').configure {
    dependsOn(tasks.named('buildVulkanNative'))
}

tasks.named('clean').configure {
    doLast {
        delete file('src/main/jniLibs')
        delete file('src/main/jni/obj')
        delete file('src/main/jni/libs')
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.3.1'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    implementation 'androidx.preference:preference:1.1.1'
    implementation 'androidx.viewpager2:viewpager2:1.0.0'

    // Test
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:4.11.0'
}

/*
 * 把 assets 声明成单元测试的输入。
 *
 * 有几个测试是在**运行时**去读 src/main/assets 下的文件的（GrassShaderCompileTest 读
 * 着色器、SunLutAssetsTest 读贴图）。Gradle 看不到这种关系 —— 它只按已声明的输入算
 * up-to-date 和缓存键，于是"只改了着色器、没改测试源码"时，
 * :app:testDebugUnitTest 会直接报 UP-TO-DATE 并把上一次的绿端回来，**一次都没跑**。
 *
 * 这个坑很难发现，因为它只在"先跑绿一次、再改资源、再跑"的顺序下出现：如果刚编辑过测试
 * 源码，编译任务会重跑、顺带把测试任务也带成 out-of-date，看起来一切正常。
 *
 * 实测（注入一行语法错误的着色器后）：加这段之前 "UP-TO-DATE / BUILD SUCCESSFUL"，
 * 加之后正常 FAILED。缓存键对"着色器都对"和"少了一条着色器"原本完全相同，
 * 也就是说 Gradle 根本区分不了这两种状态。
 */
tasks.withType(Test).configureEach {
    inputs.dir("src/main/assets")
        .withPropertyName("testReadAssets")
        .withPathSensitivity(PathSensitivity.RELATIVE)
}

def shouldBumpAfterBuild = false
gradle.taskGraph.whenReady { graph ->
    shouldBumpAfterBuild = graph.hasTask(':app:assembleRelease') || graph.hasTask('assembleRelease')
}

gradle.buildFinished { result ->
    if (shouldBumpAfterBuild && result.failure == null) {
        bumpAppVersion()
    }
}
