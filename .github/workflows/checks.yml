name: checks

# 只做代码检查，**不构建** —— 不装 Android SDK / NDK、不跑 Gradle，所以几十秒就出结果。
# 查的是"错了会静默发布出去、构建却照样成功"的那几类，见 scripts/ci_checks.py 的开头。
#
# 仓库里的单元测试（包括着色器闸门）要 Gradle 才能跑，刻意不在这里 —— 那些仍然本地跑。

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # 格式检查要比对"本次改动"，需要完整历史与 origin/main
          fetch-depth: 0

      - name: Install glslangValidator
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools

      # 装不上就**直接失败**，不要让它悄悄跳过着色器那一步：本仓库的
      # GrassShaderCompileTest 正是栽在"工具找不到 → Assume 跳过 → 报绿"上。
      - name: Verify glslangValidator is present
        run: glslangValidator --version

      - name: Run checks
        run: python3 scripts/ci_checks.py

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # 比较基准：PR 用目标分支的 sha，push 用上一个提交（新分支时是全零，退回 origin/main）
      #
      # 第三种情况是"before 指向的提交已经不在仓库里"：强推会把它换掉，而
      # `git diff <不存在的 sha>` 直接 `fatal: bad object`，整个检查红掉 ——
      # 2026-10-09 真实发生过一次（amend 后强推，before 就是被换掉的那条）。
      # 退到 HEAD~1：那次推送只有一条提交，正好等于"本次改动"。
      - name: Pick the comparison base
        id: base
        run: |
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            echo "ref=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          elif [ -z "${{ github.event.before }}" ] \
               || [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            echo "ref=origin/main" >> "$GITHUB_OUTPUT"
          elif git cat-file -e "${{ github.event.before }}^{commit}" 2>/dev/null; then
            echo "ref=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
          else
            fallback="$(git rev-parse --verify HEAD~1 2>/dev/null || echo origin/main)"
            echo "::warning::before (${{ github.event.before }}) 已不在仓库里（多半是强推）；比较基准退到 $fallback"
            echo "ref=$fallback" >> "$GITHUB_OUTPUT"
          fi

      # 只查**本次改动过**的 Java 文件（棘轮）—— 历史遗留的格式不会被拿来报红，
      # 但新写/改到的代码必须符合 AOSP 风格与 4 空格。见 scripts/format.py。
      - name: Check formatting
        run: python3 scripts/format.py --base "${{ steps.base.outputs.ref }}"
