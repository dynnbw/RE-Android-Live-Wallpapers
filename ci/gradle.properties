# CI 用的 gradle.properties（workflow 会把它复制成仓库根目录那份）。
#
# 为什么需要单独一份：仓库根的 gradle.properties **不提交** —— 它装着正式签名的口令。
# 所以 CI 用这一份，版本号由 workflow 追加。
#
# **必须与本地那份的非机密项保持一致。** 曾经这里漏了 android.useAndroidX，
# CI 就直接栽在 checkNightlyAarMetadata（2026-10-11）。
#
# 不含 sdk.dir：那是本机路径，CI 上由 workflow 写进 local.properties。
# 不含任何 RELEASE_* / PASSWORD / ALIAS：那些是机密，永远不进仓库。

# —— 版本号由 workflow 追加（APP_VERSION_CODE 用 run number，单调递增，
#    免得夜间包之间比较时被判成"降级"）——

# —— 以下是构建真正要读的 ——
android.useAndroidX=true
android.enableJetifier=true
android.buildFeatures.buildConfig=true
android.overridePathCheck=true

# —— 以下是构建性能/内存，与本地一致 ——
org.gradle.jvmargs=-Xmx2048m
org.gradle.parallel=true
org.gradle.caching=true
